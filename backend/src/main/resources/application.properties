server.port=8080
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eduflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: override EDUFLOW_JWT_SECRET in any real deployment (min 32 chars)
eduflow.jwt.secret=${EDUFLOW_JWT_SECRET:eduflow-dev-secret-change-me-please-32chars}
eduflow.jwt.expiry-hours=8

# Comma-separated origins, or patterns like http://localhost:* for local Vite ports
eduflow.cors.origin=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}

# Path to the compiled C++ scheduler (run `make` in ../os-engine first)
eduflow.engine.path=${ENGINE_PATH:../os-engine/scheduler}
